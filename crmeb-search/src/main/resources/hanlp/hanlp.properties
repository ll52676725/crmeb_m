# HanLP配置文件

# 根目录
root=./

# 分词器
Tokenizer=com.hankcs.hanlp.tokenizer.NLPTokenizer

# 词性标注
POSTagger=com.hankcs.hanlp.model.perceptron.PerceptronPOSTagger

# 命名实体识别
NER=com.hankcs.hanlp.model.perceptron.PerceptronNERecognizer

# 依存句法分析
Parser=com.hankcs.hanlp.parse.dep.DependencyParser

# 情感分析
SentimentAnalyzer=com.hankcs.hanlp.sentiment.SentimentAnalyzer

# 停用词词典
StopWordDictionary=stopwords.txt

# 核心词典
CoreDictionary=core_dictionary.txt
CoreDictionaryTransformMatrixDictionary=core_dictionary.tr.txt

# 人名词典
PersonDictionary=person.txt

# 地名词典
PlaceDictionary=place.txt

# 机构名词典
OrganizationDictionary=organization.txt

# 时间词典
TimeDictionary=time.txt

# 词性标注模型
POSTaggerModel=pos.bin

# 命名实体识别模型
NERModel=ner.bin

# 依存句法分析模型
ParserModel=parser.bin

# 情感分析模型
SentimentModel=senti.bin

# 分词结果是否显示词性
ShowTermNature=true

# 分词结果是否合并数词和量词
MergeNumberAndQuantifier=true

# 分词结果是否合并时间词
MergeTime=true

# 分词结果是否合并人名
MergePerson=true

# 分词结果是否合并地名
MergePlace=true

# 分词结果是否合并机构名
MergeOrganization=true
