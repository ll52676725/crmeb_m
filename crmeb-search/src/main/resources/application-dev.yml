server:
  port: 8085
  servlet:
    context-path: /search

spring:
  application:
    name: crmeb-search
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/crmeb?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: password
  redis:
    host: localhost
    port: 6379
    password: password
    database: 0
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.zbkj: debug
    org.springframework: info
    org.mybatis: debug

# HanLP配置
hanlp:
  root: classpath:hanlp/
  config: hanlp.properties
