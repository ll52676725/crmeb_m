server:
  port: 8085
  servlet:
    context-path: /search

spring:
  application:
    name: crmeb-search
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/crmeb?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.zbkj.search.model

# HanLP配置
hanlp:
  root: classpath:/hanlp/
  config: hanlp.properties