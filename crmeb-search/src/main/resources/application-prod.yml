server:
  port: 8085
  servlet:
    context-path: /search
  tomcat:
    max-threads: 1000
    min-spare-threads: 100
    uri-encoding: UTF-8

spring:
  application:
    name: crmeb-search
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://prod-mysql:3306/crmeb?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai&autoReconnect=true&failOverReadOnly=false
    username: prod
    password: prod-password
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: DatebookHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  redis:
    host: prod-redis
    port: 6379
    password: prod-password
    database: 0
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.zbkj: info
    org.springframework: warn
    org.mybatis: info
  file:
    name: logs/crmeb-search.log
    max-size: 100MB
    max-history: 30
    total-size-cap: 1GB

# HanLP配置
hanlp:
  root: classpath:hanlp/
  config: hanlp.properties
