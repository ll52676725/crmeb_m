server:
  port: 8085
  servlet:
    context-path: /search

spring:
  application:
    name: crmeb-search
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://test-mysql:3306/crmeb?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: test
    password: test-password
  redis:
    host: test-redis
    port: 6379
    password: test-password
    database: 0
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.zbkj: info
    org.springframework: warn
    org.mybatis: info

# HanLP配置
hanlp:
  root: classpath:hanlp/
  config: hanlp.properties
