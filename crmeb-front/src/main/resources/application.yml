# CRMEB 相关配置
crmeb:
  version: CRMEB-JAVA-KY-v1.3.4 # 当前代码版本

# 配置端口
server:
  port: 8081
  servlet:
    context-path: /         # 访问path
  tomcat:
    uri-encoding: UTF-8     # 默认编码格式
    max-threads: 1000       # 最大线程数量 默认200
    min-spare-threads: 30   # 初始化启动线程数量

spring:
  profiles:
    #  配置的环境
    #    active: #spring.profiles.active#
    active:
  servlet:
    multipart:
      max-file-size: 50MB #设置单个文件大小
      max-request-size: 50MB #设置单次请求文件的总大小
  resources:
    static-locations: classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,file:${crmeb.filePath}
  application:
    name: cemrb-front #这个很重要，这在以后的服务与服务之间相互调用一般都是根据这个name
  jackson:
    locale: zh_CN
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  #  数据库配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/crmeb?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimeZone=GMT+8&allowMultiQueries=true&rewriteBatchedStatements=true
    username: crmeb
    password: 111111
    # Druid连接池配置
    druid:
      initial-size: 50
      min-idle: 50
      max-active: 200
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,log4j
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
  redis:
    host: 127.0.0.1 #地址
    port: 6379 #端口
    password: 111111
    timeout: 30000 # 连接超时时间（毫秒）
    database: 3  #默认数据库
    jedis:
      pool:
        max-active: 500 # 连接池最大连接数（使用负值表示没有限制）
        max-wait: 5000 # 连接池最大阻塞等待时间（毫秒）
        max-idle: 50 # 连接池中的最大空闲连接
        min-idle: 20 # 连接池中的最小空闲连接
        time-between-eviction-runs: 30000 #逐出扫描的时间间隔(毫秒)
        min-evictable-idle-time-millis: 60000 #连接的最小空闲时间(毫秒)

debug: true
logging:
  level:
    io.swagger.*: error
    com.zbjk.crmeb: debug
    org.springframework.boot.autoconfigure: ERROR
  config: classpath:logback-spring.xml
  file:
    path: ./crmeb_log

# mybatis 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*/*Mapper.xml #xml扫描，多个目录用逗号或者分号分隔（告诉 Mapper 所对应的 XML 文件位置）
  # 配置slq打印日志
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
#      logic-delete-field: isDel  #全局逻辑删除字段值 3.3.0开始支持，详情看下面。
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)


#swagger 配置
swagger:
  basic:
    enable: true #是否开启
    check: false #是否打开验证
    username: #访问swagger的账号
    password: #访问swagger的密码

# ShardingSphere 分表配置
  shardingsphere:
    datasource:
      names: master
      master:
        type: com.alibaba.druid.pool.DruidDataSource
        driver-class-name: com.mysql.jdbc.Driver
        url: jdbc:mysql://127.0.0.1:3306/crmeb?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimeZone=GMT+8&allowMultiQueries=true&rewriteBatchedStatements=true
        username: crmeb
        password: 111111
    sharding:
      tables:
        eb_store_order:
          actual-data-nodes: master.eb_store_order_$->{0..9}
          table-strategy:
            standard:
              sharding-column: uid
              precise-algorithm-class-name: com.zbkj.common.config.ShardingSphereConfig
        eb_store_order_info:
          actual-data-nodes: master.eb_store_order_info_$->{0..9}
          table-strategy:
            standard:
              sharding-column: order_id
              precise-algorithm-class-name: com.zbkj.common.config.ShardingSphereConfig
        eb_store_order_status:
          actual-data-nodes: master.eb_store_order_status_$->{0..9}
          table-strategy:
            standard:
              sharding-column: oid
              precise-algorithm-class-name: com.zbkj.common.config.ShardingSphereConfig
    props:
      sql:
        show: true
  # Elasticsearch 配置
  elasticsearch:
    rest:
      uris: http://localhost:9200
      connection-timeout: 5000ms
      read-timeout: 3000ms
    username: elastic
    password: changeme
